services:
  postgres:
    image: postgres:17-alpine
    container_name: veltrex-db-v17
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: veltrex
    ports:
      - "5433:5432"
    volumes:
      - veltrex_v17_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d veltrex" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend

  redis:
    image: redis:alpine
    container_name: veltrex-redis
    restart: always
    volumes:
      - veltrex_redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend

  backend:
    image: veltrex-backend-backend-dev:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: dependencies # Build up to dependencies stage to run as root for volume operations
    container_name: veltrex-backend-app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/node_modules
    command: >
      sh -c "pnpm install &&
             pnpm exec prisma generate &&
             pnpm run start:dev"
    restart: unless-stopped
    networks:
      - backend

volumes:
  veltrex_v17_data:
  veltrex_redis_data:

networks:
  backend:
    driver: bridge
