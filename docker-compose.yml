services:
  veltrex-db-v17:
    image: postgres:17-alpine
    container_name: veltrex-db-v17
    restart: always
    environment:
      POSTGRES_USER: abhin
      POSTGRES_PASSWORD: "valtrex151%"
      POSTGRES_DB: veltrex
    ports:
      - "5433:5432"
    volumes:
      - veltrex_v17_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: veltrex-backend-app
    depends_on:
      - veltrex-db-v17
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://abhin:valtrex151%25@veltrex-db-v17:5432/veltrex?schema=public
      - PNPM_CONF_ONLY_ALLOW_TRUSTED_DEPENDENCIES=true
      - CI=true
    volumes:
      - .:/app
      - /app/node_modules
    command: >
      sh -c "pnpm install && pnpm exec prisma generate && pnpm run start:dev"
    restart: unless-stopped

volumes:
  veltrex_v17_data:
