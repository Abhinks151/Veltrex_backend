services:

  postgres:
    image: postgres:17-alpine
    container_name: veltrex-db
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  redis:
    image: redis:alpine
    container_name: veltrex-redis
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  migration:
    build:
      context: .
      dockerfile: Dockerfile
      target: migration-runner
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.production
    networks:
      - backend

  backend:
    image: veltrex-backend-backend-prod:latest
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: veltrex-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    env_file:
      - .env.production
    ports:
      - "3000:3000"
    networks:
      - backend

volumes:
  postgres_data:

networks:
  backend:
    driver: bridge
